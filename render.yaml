services:
  - type: web
    name: truecheck
    runtime: python
    
    # Build command
    buildCommand: bash build.sh
    
    # Start command
    startCommand: gunicorn Truecheck.wsgi:application --bind 0.0.0.0:$PORT
    
    # Environment variables configuration
    envVars:
      - key: DEBUG
        value: 'False'
      - key: DJANGO_SETTINGS_MODULE
        value: Truecheck.settings
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@vericheck.com
      - key: ADMIN_USERNAME
        value: admin1
      - key: ADMIN_PASSWORD
        generateValue: true
      # This connects your settings.py DATABASE_URL logic to the database below
      - key: DATABASE_URL
        fromDatabase:
          name: truecheck_db
          property: connectionString

    # Disk space for media files
    disk:
      - name: media
        mountPath: /var/data/media
        sizeGB: 1

# Mount database (Moved to the correct root level for Render Blueprints)
databases:
  - name: truecheck_db
    databaseName: truecheck_prod_db
    user: truecheck_admin
    plan: free
